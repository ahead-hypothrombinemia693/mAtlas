  - id: set_to_successor_structure
    source: set
    target: successor_structure
    type: add-data
    label: + zero and successor
    detail: Choose a distinguished element 0 and a unary map $S:N\to N$.
    citations:
      - wp-peano
      - openlogic-set-theory
  - id: e_set_top
    source: set
    target: topological_space
    type: add-data
    label: + topology $\tau$
    detail: Choose open subsets satisfying the topology axioms.
    citations:
      - wp-top-space
      - nlab-top-space
      - topology-without-tears
  - id: e_set_transitive
    source: set
    target: transitive_set
    type: impose-axiom
    label: + transitivity
    detail: Require every element of an element of $X$ to lie in $X$.
    citations:
      - wp-transitive-set
      - openlogic-set-theory
  - id: e_set_undirected_graph
    source: set
    target: undirected_graph
    type: add-data
    label: + edges
    detail: Add a collection of edges with endpoints in the vertex set.
    citations:
      - wp-graph
      - nlab-graph
      - diestel-graph-theory
  - id: e_set_uniform
    source: set
    target: uniform_space
    type: add-data
    label: + uniformity
    detail: Choose entourages satisfying the uniformity axioms.
    citations:
      - wp-uniform
      - nlab-uniform
      - topology-without-tears
  - id: successor_structure_to_peano_system
    source: successor_structure
    target: peano_system
    type: impose-axiom
    label: + Peano axioms
    detail: Require successor injectivity, zero not to be a successor, and the adopted second-order induction axiom.
    citations:
      - wp-peano
      - milne-algebraic-number-theory
  - id: set_to_empty_set
    source: set
    target: empty_set
    type: impose-axiom
    label: require no elements
    detail: Select the unique set having no elements.
    citations:
      - wp-empty-set
      - openlogic-set-theory
    overview: true
  - id: set_to_power_set
    source: set
    target: power_set
    type: canonical-construction
    label: form all subsets
    detail: Send $X$ to $\mathcal P(X)$, the set of all subsets of $X$.
    citations:
      - wp-power-set
      - openlogic-set-theory
    overview: true
  - id: von_neumann_zero_to_one
    source: von_neumann_zero
    target: von_neumann_one
    type: canonical-construction
    label: apply successor
    detail: Applying $S(x)=x\cup\{x\}$ to $0$ gives $1=\{0\}$.
    citations:
      - wp-von-neumann-ordinal
      - openlogic-set-theory
    overview: true
  - id: von_neumann_successor_to_one
    source: von_neumann_successor
    target: von_neumann_one
    type: canonical-construction
    label: $S(0)=1$
    detail: The successor operation sends $0=\varnothing$ to $1=\{\varnothing\}$.
    citations:
      - wp-von-neumann-ordinal
  - id: von_neumann_successor_to_finite_ordinal
    source: von_neumann_successor
    target: finite_ordinal
    type: canonical-construction
    label: iterate from zero
    detail: Finite iteration of von Neumann successor from $0$ produces exactly the finite ordinals.
    citations:
      - wp-von-neumann-ordinal
      - openlogic-set-theory
    overview: true
  - id: zf_to_zfc
    source: zermelo_fraenkel_set_theory
    target: zfc_set_theory
    type: impose-axiom
    label: + axiom of choice
    detail: Adjoin AC to ZF; the resulting theory is ZFC.
    citations:
      - wp-zf
      - wp-axiom-choice
      - sep-axiom-choice
    overview: true
  - id: zfc_implies_choice
    source: zfc_set_theory
    target: axiom_of_choice
    type: theorem-implication
    label: contains AC
    detail: The axiom of choice is one of the axioms of ZFC.
    citations:
      - wp-zf
      - wp-axiom-choice
  - id: choice_to_well_ordering
    source: axiom_of_choice
    target: well_ordering_theorem
    type: theorem-implication
    label: equivalent over ZF
    detail: Over ZF, AC implies that every set can be well-ordered; conversely, the well-ordering theorem implies AC.
    citations:
      - sep-axiom-choice
      - openlogic-set-theory
    overview: true
  - id: well_ordering_to_cardinal
    source: well_ordering_theorem
    target: cardinal
    type: theorem-implication
    label: cardinal representative for every set
    detail: A well-order on a set has a unique ordinal order type; its least equipotent ordinal is the set’s cardinal.
    citations:
      - wp-cardinal
      - openlogic-set-theory
    overview: true
  - id: zfc_to_aleph_hierarchy
    source: zfc_set_theory
    target: aleph_hierarchy
    type: theorem-implication
    label: all set cardinalities are alephs
    detail: Choice ensures every set is well-orderable, so every infinite set has cardinality $\aleph_\alpha$ for some ordinal $\alpha$.
    citations:
      - wp-aleph-number
      - sep-axiom-choice
  - id: well_ordering_implies_choice
    source: well_ordering_theorem
    target: axiom_of_choice
    type: theorem-implication
    label: equivalent over ZF
    detail: Over ZF, well-order every member of a family and choose its least element; thus the well-ordering theorem implies AC.
    citations:
      - sep-axiom-choice
      - openlogic-set-theory
  - id: zf_proves_empty_set
    source: zermelo_fraenkel_set_theory
    target: empty_set
    type: theorem-implication
    label: proves existence and uniqueness
    detail: ZF proves that a set with no elements exists and extensionality proves that it is unique.
    citations:
      - wp-zf
      - wp-empty-set
      - openlogic-set-theory
  - id: zf_provides_power_sets
    source: zermelo_fraenkel_set_theory
    target: power_set
    type: theorem-implication
    label: power-set axiom
    detail: The power-set axiom of ZF asserts that for every set $X$, the collection $\mathcal P(X)$ is a set.
    citations:
      - wp-zf
      - wp-power-set
      - openlogic-set-theory
  - id: zfc_well_orders_continuum
    source: zfc_set_theory
    target: continuum_cardinal
    type: theorem-implication
    label: well-orderable continuum
    detail: Choice well-orders $\mathbb R$, so its equipotence type has a unique initial-ordinal representative $\mathfrak c$.
    citations:
      - wp-axiom-choice
      - wp-cardinality-continuum
      - sep-axiom-choice
  - id: zfc_supports_beth_hierarchy
    source: zfc_set_theory
    target: beth_hierarchy
    type: theorem-implication
    label: well-order power-set sizes
    detail: Choice ensures that every power set appearing in the beth recursion has an initial-ordinal cardinal representative.
    citations:
      - wp-axiom-choice
      - wp-beth-number
      - sep-axiom-choice
  - id: story_hilbert_program_to_formal_proof_system_historically_motivated
    source: hilbert_program
    target: formal_proof_system
    type: historically-motivated
    label: formalize mathematics
    detail: Hilbert’s program motivated precise formal systems and metamathematical consistency proofs.
    citations:
      - openlogic-incompleteness
