  - id: function
    label: Function
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - logic
      - category-theory
    level: 2
    kind: structure
    summary: A total single-valued relation from a domain set to a codomain set.
    carriers:
      - domain $X$
      - codomain $Y$
    data:
      - subset $f \subseteq X\times Y$
    axioms:
      - for every $x\in X$ there exists exactly one $y\in Y$ with $(x,y)\in f$
    induces: []
    notes: ''
    citations:
      - wp-function
      - nlab-function
      - openlogic-set-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: successor_structure
    label: Successor structure
    primaryDomain: foundation
    domains:
      - foundation
      - logic
      - number-theory
    level: 2
    kind: structure
    summary: A set equipped with a distinguished zero and a unary successor operation.
    carriers:
      - set $N$
    data:
      - distinguished element $0$
      - 'successor map $S: N\to N$'
    axioms: []
    induces: []
    notes: The second-order Peano axioms are categorical under full second-order semantics. First-order Peano arithmetic is not categorical by the compactness and Löwenheim–Skolem theorems.
    citations:
      - wp-peano
      - openlogic-set-theory
    primaryField: mathematics
    fields:
      - mathematics
    conceptType: Foundational structure
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: zermelo_fraenkel_set_theory
    label: Zermelo–Fraenkel set theory (ZF)
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - logic
    level: 2
    conceptType: Axiomatic theory
    summary: The standard first-order set theory with extensionality, foundation, pairing, union, power set, infinity, and the separation and replacement schemas, but without the axiom of choice.
    carriers:
      - first-order language with binary relation $\in$
    data:
      - axioms and axiom schemas of ZF
    axioms: []
    induces:
      - formal universe in which the set-theoretic constructions are carried out
    notes: Equivalent presentations may trade some axioms for theorems; the defining editorial distinction here is that ZF omits Choice.
    citations:
      - wp-zf
      - openlogic-set-theory
      - sep-set-theory
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: axiom_of_choice
    label: Axiom of choice (AC)
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - logic
    level: 3
    conceptType: Axiom
    summary: The assertion that every set-indexed family of nonempty sets has a choice function.
    carriers:
      - set-theoretic statement
    data:
      - choice function selecting one element from each member of a family
    axioms: []
    induces:
      - well-ordering theorem and Zorn’s lemma over ZF
    notes: AC is independent of ZF, assuming ZF is consistent. Its standard equivalents are equivalent over ZF, not in arbitrary weak background theories.
    citations:
      - wp-axiom-choice
      - sep-axiom-choice
      - openlogic-set-theory
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: well_ordering_theorem
    label: Well-ordering theorem
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - order
      - logic
    level: 4
    conceptType: Theorem
    summary: Every set can be well-ordered.
    carriers:
      - set-theoretic statement
    data: []
    axioms: []
    induces:
      - a cardinal representative for every set
    notes: Over ZF, the well-ordering theorem is equivalent to the axiom of choice.
    citations:
      - sep-axiom-choice
      - openlogic-set-theory
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: zfc_set_theory
    label: Zermelo–Fraenkel set theory with Choice (ZFC)
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - logic
    level: 4
    conceptType: Axiomatic theory
    summary: ZF augmented by the axiom of choice.
    carriers:
      - first-order language with binary relation $\in$
    data:
      - all axioms and schemas of ZF
      - axiom of choice
    axioms: []
    induces:
      - the conventional classical foundational setting for much of mathematics
    notes: CH, GCH, and the existence of inaccessible, measurable, or supercompact cardinals are not theorems of ZFC, under the corresponding consistency assumptions.
    citations:
      - wp-zf
      - wp-axiom-choice
      - sep-set-theory
      - sep-large-cardinals
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: von_neumann_zero
    label: Von Neumann zero $0$
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - number-theory
    level: 2
    conceptType: Set-theoretic numeral
    summary: The chosen realization $0:=\varnothing$.
    carriers:
      - set $\varnothing$
    data: []
    axioms: []
    induces:
      - first finite ordinal and finite cardinal
    notes: This is the standard von Neumann encoding; abstract zero is not intrinsically identical with the empty set.
    citations:
      - wp-von-neumann-ordinal
      - nlab-natural-number
      - openlogic-set-theory
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: von_neumann_successor
    label: Von Neumann successor
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - number-theory
    level: 3
    conceptType: Canonical construction
    summary: The operation $S(x)=x\cup\{x\}$; on ordinals it produces the least larger ordinal.
    carriers:
      - set or ordinal $x$
    data:
      - $S(x)=x\cup\{x\}$
    axioms: []
    induces:
      - finite ordinals by iteration from $0$
      - successor ordinals
    notes: ''
    citations:
      - wp-von-neumann-ordinal
      - openlogic-set-theory
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: von_neumann_one
    label: Von Neumann one $1$
    primaryDomain: foundation
    domains:
      - foundation
      - set-theory
      - number-theory
    level: 4
    conceptType: Set-theoretic numeral
    summary: The set $1:=S(0)=\{0\}=\{\varnothing\}$.
    carriers:
      - singleton $\{\varnothing\}$
    data: []
    axioms: []
    induces:
      - second finite ordinal and cardinal
    notes: ''
    citations:
      - wp-von-neumann-ordinal
      - nlab-natural-number
  - id: hilbert_program
    label: Hilbert’s program
    primaryDomain: foundation
    domains:
      - foundation
      - logic
      - computability-theory
    level: 3
    kind: structure
    summary: The program of formalizing broad parts of mathematics and proving their consistency by secure finitary methods.
    carriers:
      - formalized mathematics
    data:
      - finitary metamathematical methods
    axioms: []
    induces:
      - Consistency and completeness goals
    notes: The incompleteness theorems constrain the original program; they do not eliminate formal axiomatic or proof-theoretic research.
    citations:
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
