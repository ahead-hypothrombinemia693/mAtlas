  id: successor_cardinal
  label: Successor cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  level: 8
  conceptType: Cardinal class
  summary: For a cardinal $\kappa$, the least cardinal $\kappa^+$ strictly greater than $\kappa$.
  carriers:
  - cardinal $\kappa^+$
  data: []
  axioms:
  - $\kappa<\kappa^+$ and no cardinal lies strictly between them
  induces: []
  notes: Cantor’s theorem gives $\kappa^+\le 2^\kappa$, but equality is not provable in ZFC in general.
  citations:
  - wp-cardinal
  - wp-continuum-hypothesis
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: limit_cardinal
  label: Limit cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 8
  conceptType: Cardinal class
  summary: An infinite cardinal that is not the successor cardinal of any smaller cardinal.
  carriers:
  - cardinal $\lambda$
  data: []
  axioms:
  - $\lambda$ is infinite, and $\kappa^+<\lambda$ for every cardinal $\kappa<\lambda$
  induces: []
  notes: This convention includes $\aleph_0$ as the least limit cardinal. Some authors instead use “limit cardinal” only for uncountable alephs whose indices are limit ordinals.
  citations:
  - wp-aleph-number
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: epsilon_zero
  label: Epsilon-zero ordinal $\varepsilon_0$
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - order
  level: 9
  conceptType: Distinguished ordinal
  summary: The least nonzero fixed point of ordinal exponentiation $\alpha\mapsto\omega^\alpha$.
  carriers:
  - ordinal $\varepsilon_0$
  data: []
  axioms:
  - $\omega^{\varepsilon_0}=\varepsilon_0$
  induces:
  - proof-theoretic ordinal of Peano arithmetic
  notes: $\varepsilon_0$ is countable despite lying far beyond every finite tower formed from $\omega$ by ordinal exponentiation.
  citations:
  - wp-epsilon-number
  - wp-ordinal-arithmetic
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: aleph_hierarchy
  label: Aleph hierarchy
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 9
  conceptType: Cardinal hierarchy
  summary: The transfinite enumeration $\aleph_\alpha$ of the infinite initial ordinals.
  carriers:
  - class-indexed family of cardinals
  data:
  - $\aleph_0$
  - $\aleph_{\alpha+1}=\aleph_\alpha^+$
  - $\aleph_\lambda=\sup_{\alpha<\lambda}\aleph_\alpha$ for limit $\lambda$
  axioms: []
  induces: []
  notes: In ZF, alephs enumerate the well-orderable infinite cardinalities; Choice says every set is well-orderable and hence has an aleph cardinality.
  citations:
  - wp-aleph-number
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: beth_hierarchy
  label: Beth hierarchy
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 9
  conceptType: Cardinal hierarchy
  summary: In ZFC, the cardinal hierarchy generated from $\beth_0=\aleph_0$ by repeated power sets and suprema at limit stages.
  carriers:
  - class-indexed family of cardinals
  data:
  - $\beth_{\alpha+1}=2^{\beth_\alpha}$
  - $\beth_\lambda=\sup_{\alpha<\lambda}\beth_\alpha$
  axioms: []
  induces: []
  notes: Without Choice, a power set of a well-orderable set need not be well-orderable; the displayed initial-ordinal beth hierarchy therefore uses the ZFC setting selected later in the story.
  citations:
  - wp-beth-number
  - wp-cantor-theorem
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: class_of_all_ordinals
  label: Class of all ordinals $\mathrm{Ord}$
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 10
  conceptType: Proper class
  summary: The collection of every ordinal, ordered by membership.
  carriers:
  - proper class $\mathrm{Ord}$
  data: []
  axioms:
  - not a set
  induces:
  - indexing class for transfinite hierarchies
  notes: If $\mathrm{Ord}$ were a set, it would itself determine an ordinal larger than every ordinal, giving the Burali–Forti contradiction.
  citations:
  - wp-ordinal
  - sep-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: continuum_cardinal
  label: Cardinality of the continuum $\mathfrak c$
  primaryDomain: set-theory
  domains:
  - set-theory
  - analysis
  - number-theory
  level: 10
  conceptType: Distinguished cardinal
  summary: The size of the real line, denoted $\mathfrak c$; in ZFC it is the cardinal $|\mathbb R|=2^{\aleph_0}$.
  carriers:
  - equipotence type of $\mathbb R$; an initial ordinal under Choice
  data: []
  axioms: []
  induces:
  - size of $\mathcal P(\mathbb N)$ and of the real line
  notes: In bare ZF, $\mathbb R$ need not be well-orderable, so its size need not have an initial-ordinal representative. The equality with $|\mathcal P(\mathbb N)|$ is equipotence, not literal identity.
  citations:
  - wp-cardinality-continuum
  - wp-cantor-theorem
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: continuum_hypothesis
  label: Continuum hypothesis
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 11
  conceptType: Independent statement
  summary: The assertion $2^{\aleph_0}=\aleph_1$, equivalently that no cardinal lies strictly between $\aleph_0$ and $\mathfrak c$.
  carriers:
  - set-theoretic statement
  data: []
  axioms: []
  induces: []
  notes: Gödel and Cohen showed that CH can neither be disproved nor proved from ZFC, assuming ZFC is consistent.
  citations:
  - wp-continuum-hypothesis
  - sep-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: generalized_continuum_hypothesis
  label: Generalized continuum hypothesis
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 12
  conceptType: Independent statement
  summary: The assertion $2^\kappa=\kappa^+$ for every infinite cardinal $\kappa$.
  carriers:
  - set-theoretic statement
  data: []
  axioms: []
  induces: []
  notes: GCH implies CH and is independent of ZFC, relative to the consistency of ZFC.
  citations:
  - wp-continuum-hypothesis
  - sep-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: large_cardinal
  label: Large cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 13
  conceptType: Cardinal hierarchy class
  summary: A cardinal satisfying one of several strong closure, compactness, measure, or elementary-embedding properties used to calibrate set-theoretic strength.
  carriers:
  - cardinal $\kappa$
  data: []
  axioms:
  - a specified large-cardinal property
  induces:
  - strong consistency and reflection principles
  notes: ZFC does not prove that inaccessible, measurable, or supercompact cardinals exist, assuming the usual consistency hypotheses; their existence is adopted through additional axioms.
  citations:
  - wp-large-cardinal
  - sep-large-cardinals
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: inaccessible_cardinal
  label: Strongly inaccessible cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 14
  conceptType: Large-cardinal notion
  summary: An uncountable regular strong-limit cardinal.
  carriers:
  - cardinal $\kappa$
  data: []
  axioms:
  - $\operatorname{cf}(\kappa)=\kappa$
  - $2^\lambda<\kappa$ for every $\lambda<\kappa$
  induces:
  - a transitive set $V_\kappa$ modeling a substantial fragment of ZFC
  notes: The existence of an inaccessible cardinal is not provable in ZFC if ZFC is consistent.
  citations:
  - wp-inaccessible-cardinal
  - sep-large-cardinals
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: measurable_cardinal
  label: Measurable cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - measure
  level: 15
  conceptType: Large-cardinal notion
  summary: An uncountable cardinal $\kappa$ carrying a nonprincipal $\kappa$-complete ultrafilter.
  carriers:
  - cardinal $\kappa$
  data:
  - nonprincipal $\kappa$-complete ultrafilter on $\kappa$
  axioms: []
  induces:
  - elementary embedding of the universe into an inner model
  notes: Every measurable cardinal is strongly inaccessible in ZFC.
  citations:
  - wp-measurable-cardinal
  - sep-large-cardinals
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: supercompact_cardinal
  label: Supercompact cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 16
  conceptType: Large-cardinal notion
  summary: A cardinal $\kappa$ whose elementary-embedding or fine-measure properties witness compactness at every scale $\lambda\ge\kappa$.
  carriers:
  - cardinal $\kappa$
  data:
  - fine normal $\kappa$-complete measures on $\mathcal P_\kappa(\lambda)$ for all $\lambda\ge\kappa$
  axioms: []
  induces:
  - very strong compactness and reflection principles
  notes: Every supercompact cardinal is measurable. Measurability alone does not imply supercompactness.
  citations:
  - wp-supercompact-cardinal
  - sep-large-cardinals
