nodes:
- id: finite_set
  label: Finite set
  primaryDomain: set-theory
  domains:
  - set-theory
  - foundation
  - combinatorics
  level: 1
  kind: structure
  summary: A set in bijection with $\{0,\ldots,n-1\}$ for some natural number $n \in \mathbb{N}$, including $n=0$.
  carriers:
  - set $X$
  data: []
  axioms:
  - finite cardinality
  induces: []
  notes: ''
  citations:
  - wp-finite-set
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
- id: countable_set
  label: Countable set
  primaryDomain: set-theory
  domains:
  - set-theory
  - foundation
  level: 2
  kind: structure
  summary: A finite or countably infinite set.
  carriers:
  - set $X$
  data: []
  axioms:
  - injects into the natural numbers
  induces: []
  notes: 'Convention: “countable” means finite or countably infinite (at most countable). Some authors reserve “countable” for countably infinite sets.'
  citations:
  - wp-countable-set
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
