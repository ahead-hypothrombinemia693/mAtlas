- id: transitive_set
  label: Transitive set
  primaryDomain: set-theory
  domains:
  - set-theory
  - foundation
  level: 2
  kind: structure
  summary: A set whose elements are all subsets of it.
  carriers:
  - set $X$
  data: []
  axioms:
  - $y\in x\in X$ implies $y\in X$
  induces: []
  notes: ''
  citations:
  - wp-transitive-set
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
  conceptType: Set-theoretic property
- id: well_founded_relation
  label: Well-founded relation
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 2
  kind: structure
  summary: An endorelation for which every nonempty subset has an $R$-minimal element.
  carriers:
  - set $X$
  data:
  - binary endorelation $R \subseteq X\times X$
  axioms:
  - every nonempty subset has an $R$-minimal element
  induces: []
  notes: The formulation by absence of infinite descending sequences is equivalent only under suitable choice/dependent-choice assumptions and convention choices.
  citations:
  - wp-well-founded
  - nlab-well-founded
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
- id: ordinal
  label: Ordinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 4
  kind: structure
  summary: A transitive set well-ordered by membership.
  carriers:
  - transitive set $\alpha$
  data: []
  axioms:
  - the membership relation $\in$ well-orders $\alpha$
  induces:
  - canonical well-order
  notes: Equivalently, an ordinal is a transitive set all of whose elements are transitive; the present formulation follows the standard von Neumann definition.
  citations:
  - wp-ordinal
  - nlab-ordinal
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
  conceptType: Set-theoretic order type
- id: cardinal
  label: Cardinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  level: 5
  kind: structure
  summary: An initial ordinal used to represent the size of a set.
  carriers:
  - ordinal $\kappa$
  data: []
  axioms:
  - not equipotent with any smaller ordinal
  induces: []
  notes: A cardinal is an initial ordinal. In ZF this represents the size of any well-orderable set; assigning a cardinal to every set is equivalent to the well-ordering principle and hence to the axiom of choice.
  citations:
  - wp-cardinal
  - nlab-cardinal
  - openlogic-set-theory
  primaryField: mathematics
  fields:
  - mathematics
  conceptType: Set-theoretic size representative
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: empty_set
  label: Empty set
  primaryDomain: set-theory
  domains:
  - set-theory
  - foundation
  level: 1
  conceptType: Canonical set
  summary: The unique set $\varnothing$ having no elements.
  carriers:
  - set $\varnothing$
  data: []
  axioms:
  - for every set $x$, $x\notin\varnothing$
  induces: []
  notes: The empty set is used as the von Neumann realization of zero, but that identification is a chosen encoding rather than an intrinsic meaning of zero.
  citations:
  - wp-empty-set
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: power_set
  label: Power set
  primaryDomain: set-theory
  domains:
  - set-theory
  - foundation
  level: 2
  conceptType: Canonical construction
  summary: For a set $X$, the set $\mathcal P(X)$ of all subsets of $X$.
  carriers:
  - set $X$
  data:
  - $\mathcal P(X)=\{A:A\subseteq X\}$
  axioms: []
  induces:
  - strictly larger cardinality by Cantor’s theorem
  notes: In ZF, the power-set axiom guarantees that $\mathcal P(X)$ is a set.
  citations:
  - wp-power-set
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: cantors_theorem
  label: Cantor’s theorem
  primaryDomain: set-theory
  domains:
  - set-theory
  - logic
  - foundation
  level: 4
  conceptType: Theorem
  summary: For every set $X$, no function $X\to\mathcal P(X)$ is surjective; hence $|X|<|\mathcal P(X)|$.
  carriers:
  - set $X$
  data:
  - diagonal subset $D=\{x\in X:x\notin f(x)\}$
  axioms:
  - ordinary classical or intuitionistic set theory suffices
  induces:
  - an unending hierarchy of larger cardinalities
  notes: The theorem rules out a greatest cardinal and does not depend on the continuum hypothesis.
  citations:
  - wp-cantor-theorem
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: finite_ordinal
  label: Finite ordinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - number-theory
  - foundation
  level: 5
  conceptType: Ordinal class
  summary: 'A von Neumann ordinal $n$ obtained from $0=\varnothing$ by finitely many successor steps, so $n=\{0,1,\ldots,n-1\}$.  For example, $0=\varnothing$, $1=\{0\}$, $2=\{0,1\}$, $3=\{0,1,2\}$, and so on, or in terms of empty sets: $0=\varnothing$, $1=\{\varnothing\}$, $2=\{\varnothing,\{\varnothing\}\}$, $3=\{\varnothing,\{\varnothing\},\{\varnothing,\{\varnothing\}\}\}$, and so on.'
  carriers:
  - transitive finite set $n$
  data: []
  axioms:
  - membership well-orders $n$
  induces:
  - finite cardinal and natural-number numeral
  notes: Finite ordinals are canonical representatives of finite order types and finite cardinalities.
  citations:
  - wp-von-neumann-ordinal
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: successor_ordinal
  label: Successor ordinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - foundation
  level: 5
  conceptType: Ordinal class
  summary: An ordinal of the form $\alpha+1=\alpha\cup\{\alpha\}$.
  carriers:
  - ordinal $\alpha$
  data:
  - successor operation $S(\alpha)=\alpha\cup\{\alpha\}$
  axioms: []
  induces:
  - least ordinal strictly greater than $\alpha$
  notes: ''
  citations:
  - wp-ordinal
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: limit_ordinal
  label: Limit ordinal
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 5
  conceptType: Ordinal class
  summary: A nonzero ordinal that is not a successor ordinal; equivalently, an ordinal equal to the union of all smaller ordinals.
  carriers:
  - ordinal $\lambda$
  data: []
  axioms:
  - $\lambda\ne0$ and $\alpha+1<\lambda$ for every $\alpha<\lambda$
  induces:
  - limit stages of transfinite definitions
  notes: $\omega$ is the first limit ordinal.
  citations:
  - wp-ordinal
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
  - mathematics
  id: omega
  label: First infinite ordinal $\omega$
  primaryDomain: set-theory
  domains:
  - set-theory
  - number-theory
  - order
  - foundation
  level: 6
  conceptType: Distinguished ordinal
  summary: The least infinite ordinal and the set of all finite von Neumann ordinals.
  carriers:
  - set $\omega=\{0,1,2,\ldots\}$
  data:
  - membership order
  axioms:
  - least inductive set
  induces:
  - standard carrier of the natural numbers
  - first infinite cardinal when viewed by cardinality
  notes: $\omega$ is an ordinal; $\aleph_0$ denotes its role as the least infinite cardinal. In the von Neumann convention they have the same underlying set but different structural roles.
  citations:
  - wp-von-neumann-ordinal
  - nlab-natural-number
  - openlogic-set-theory
- kind: structure
  primaryField: mathematics
  fields:
