  id: first_uncountable_ordinal
  label: First uncountable ordinal $\omega_1$
  primaryDomain: set-theory
  domains:
  - set-theory
  - order
  - logic
  level: 8
  conceptType: Distinguished ordinal
  summary: The least uncountable ordinal, equivalently the set of all countable ordinals.
  carriers:
  - ordinal $\omega_1$
  data: []
  axioms:
  - every $\alpha<\omega_1$ is countable
  induces:
  - initial ordinal $\aleph_1$
  notes: Its underlying cardinal is $\aleph_1$; the continuum hypothesis asks whether $|\mathbb R|=\aleph_1$.
  citations:
  - wp-first-uncountable-ordinal
  - openlogic-set-theory
