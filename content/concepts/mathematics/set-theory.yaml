  - foundation
  level: 2
  kind: structure
  summary: A collection of objects labelled by elements of an index set.
  carriers:
  - index set $I$
  - ambient class or set of values
  data:
  - function $I\to X$
  axioms: []
  induces: []
  notes: ''
  citations:
  - wp-indexed-family
